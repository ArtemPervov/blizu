name: blizu

services:
  api:
    image: ${BLIZU_IMAGE_PREFIX:-blizu}-api:${BLIZU_VERSION:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      ENABLE_DEMO: ${ENABLE_DEMO:-false}
      DELIVERY_STALE_HOURS: ${DELIVERY_STALE_HOURS:-72}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set the arbiter email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong arbiter password}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      DATA_DIR: /app/data
      PORT: 3001
    volumes:
      - blizu_data:/app/data
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${BLIZU_IMAGE_PREFIX:-blizu}-web:${BLIZU_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      app:
      proxy:
        aliases:
          - blizu-web
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  blizu_data:
    name: blizu_data

networks:
  app:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
